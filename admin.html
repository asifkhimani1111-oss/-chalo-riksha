<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - એડમિન અને કમિશન હિસાબ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #ff9800; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .btn { background: #25d366; color: white; border: none; padding: 12px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #1ebe5d; }
        .driver-card { background: #fff3e0; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 5px solid #ff9800; }
        .driver-card p { margin: 5px 0; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; float: right; font-size: 14px; }
        .btn-delete:hover { background: #c0392b; }
        .clear { clear: both; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 એડમિન ડેશબોર્ડ & હિસાબ</h2>
    
    <div class="form-group">
        <label>ડ્રાઇવરનું નામ:</label>
        <input type="text" id="driverName" placeholder="ડ્રાઇવરનું પૂરું નામ લખો">
    </div>

    <div class="form-group">
        <label>રિક્ષા નંબર:</label>
        <input type="text" id="ricshaNo" placeholder="દા.ત. GJ-13-XX-1234">
    </div>

    <div class="form-group">
        <label>મોબાઈલ નંબર (WhatsApp):</label>
        <input type="tel" id="driverPhone" placeholder="10 આંકડાનો નંબર લખો">
    </div>

    <div class="form-group">
        <label>કમિશન / જમા રકમ (₹):</label>
        <input type="number" id="driverCommission" placeholder="કમિશનની રકમ લખો" value="0">
    </div>

    <button class="btn" onclick="registerDriver()">ડ્રાઇવર રજીસ્ટર કરો / હિસાબ ઉમેરો</button>

    <hr style="margin: 25px 0; border: 0; border-top: 1px solid #ddd;">

    <h3>📋 રજીસ્ટર્ડ ડ્રાઇવરો અને હિસાબ</h3>
    <div id="driverList">
        <!-- ડ્રાઇવરોનું લિસ્ટ અહીં દેખાશે -->
    </div>
</div>

<script>
    function registerDriver() {
        let name = document.getElementById('driverName').value.trim();
        let ricshaNo = document.getElementById('ricshaNo').value.trim();
        let phone = document.getElementById('driverPhone').value.trim();
        let commission = document.getElementById('driverCommission').value.trim();

        if (!name || !ricshaNo || !phone) {
            alert('કૃપા કરીને બધી વિગતો ભરો!');
            return;
        }

        let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];

        let existingIndex = drivers.findIndex(d => d.phone === phone);
        if (existingIndex !== -1) {
            drivers[existingIndex].name = name;
            drivers[existingIndex].ricshaNo = ricshaNo;
            drivers[existingIndex].commission = commission;
        } else {
            drivers.push({ name: name, ricshaNo: ricshaNo, phone: phone, commission: commission });
        }

        localStorage.setItem('rickshawDrivers', JSON.stringify(drivers));
        alert('ડ્રાઇવરની માહિતી અને હિસાબ સફળતાપૂર્વક સેવ થઈ ગયો!');
        
        document.getElementById('driverName').value = '';
        document.getElementById('ricshaNo').value = '';
        document.getElementById('driverPhone').value = '';
        document.getElementById('driverCommission').value = '0';

        loadDriverList();
    }

    function loadDriverList() {
        let drivers = JSON.parse(localStorage.getItem('rickshaDrivers')) || [];
        let listDiv = document.getElementById('driverList');
        listDiv.innerHTML = '';

        if (drivers.length === 0) {
            listDiv.innerHTML = '<p style="text-align: center; color: #777;">હાલ કોઈ ડ્રાઇવર રજીસ્ટર્ડ નથી.</p>';
            return;
        }

        drivers.forEach(function(driver, index) {
            let card = document.createElement('div');
            card.className = 'driver-card';
            card.innerHTML = `
                <button class="btn-delete" onclick="deleteDriver(${index})">ડિલીટ</button>
                <p><b>નામ:</b> ${driver.name}</p>
                <p><b>રિક્ષા નંબર:</b> ${driver.ricshaNo}</p>
                <p><b>મોબાઈલ:</b> ${driver.phone}</p>
                <p><b>કમિશન / હિસાબ:</b> ₹${driver.commission || 0}</p>
                <div class="clear"></div>
            `;
            listDiv.appendChild(card);
        });
    }

    function deleteDriver(index) {
        let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
        if (confirm('શું તમે આ ડ્રાઇવરને ડિલીટ કરવા માંગો છો?')) {
            drivers.splice(index, 1);
            localStorage.setItem('rickshawDrivers', JSON.stringify(drivers));
            loadDriverList();
        }
    }

    window.onload = loadDriverList;
</script>

</body>
</html>
