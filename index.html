<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ઓટો બુકિંગ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #ff9800; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .btn { background: #25d366; color: white; border: none; padding: 12px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #1ebe5d; }
        .btn-cancel { background: #e74c3c; margin-top: 8px; }
        .btn-cancel:hover { background: #c0392b; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ચાલો રિક્ષા બુકિંગ</h2>
    
    <div class="form-group">
        <label>તમારું ગામ / સ્થળ પસંદ કરો:</label>
        <select id="pickup">
            <option value="ગઢડા બસ સ્ટેન્ડ">ગઢડા બસ સ્ટેન્ડ</option>
            <option value="ગઢડા હોસ્પિટલ રોડ">ગઢડા હોસ્પિટલ રોડ</option>
            <option value="સ્વામિનારાયણ મંદિર ગઢડા">સ્વામિનારાયણ મંદિર ગઢડા</option>
            <option value="શાકમાર્કેટ ગઢડા">શાકમાર્કેટ ગઢડા</option>
            <option value="માર્કેટિંગ યાર્ડ ગઢડા">માર્કેટિંગ યાર્ડ ગઢડા</option>
            <option value="રોહશાળા રોડ">રોહશાળા રોડ</option>
            <option value="ઢસા જંક્શન">ઢસા જંક્શન</option>
            <option value="રાણપુર રોડ">રાણપુર રોડ</option>
            <option value="બોટાદ રોડ">બોટાદ રોડ</option>
            <option value="ઢસા રોડ">ઢસા રોડ</option>
            <option value="રાંદરડા">રાંદરડા</option>
            <option value="માલપરા">માલપરા</option>
            <option value="રાયપર">રાયપર</option>
            <option value="હરપુરા">હરપુરા</option>
            <option value="પાટીયા">પાટીયા</option>
            <option value="સુરગપરા">સુરગપરા</option>
            <option value="સંગાણી">સંગાણી</option>
            <option value="ભંડારીયા">ભંડારીયા</option>
            <option value="બોવાળ">બોવાળ</option>
            <option value="ગાંધીધામ ચોકડી">ગાંધીધામ ચોકડી</option>
            <option value="પીપરડી">પીપરડી</option>
            <option value="જનાળા">જનાળા</option>
            <option value="માણસા">માણસા</option>
            <option value="ચારોડીયા">ચારોડીયા</option>
            <option value="સખપર">સખપર</option>
        </select>
    </div>

    <div class="form-group">
        <label>કયાં જવું છે? (ડ્રોપ લોકેશન):</label>
        <input type="text" id="dropoff" placeholder="ડ્રોપ લોકેશન લખો">
    </div>

    <div class="form-group">
        <label>અંદાજિત અંતર (KM માં લખો):</label>
        <input type="number" id="distanceKm" placeholder="દા.ત. 5 KM" value="3">
    </div>

    <div class="form-group">
        <label>ડ્રાઇવર પસંદ કરો:</label>
        <select id="driverSelect">
            <option value="">-- પહેલાં ડ્રાઇવર પસંદ કરો --</option>
        </select>
    </div>

    <button class="btn" onclick="bookRide()">WhatsApp પર બુકિંગ મોકલો</button>
    <button class="btn btn-cancel" onclick="cancelRide()">બુકિંગ કેન્સલ કરો</button>
</div>

<script>
    function loadDrivers() {
        let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
        let select = document.getElementById('driverSelect');
        select.innerHTML = '<option value="">-- ડ્રાઇવર પસંદ કરો --</option>';
        
        if(drivers.length === 0) {
            select.innerHTML += '<option value="" disabled>હાલ કોઈ ડ્રાઇવર ઉપલબ્ધ નથી</option>';
            return;
        }

        drivers.forEach(function(driver) {
            let opt = document.createElement('option');
            opt.value = driver.phone;
            opt.textContent = driver.name + ' (' + driver.ricshaNo + ')';
            select.appendChild(opt);
        });
    }

    function bookRide() {
        let pickup = document.getElementById('pickup').value;
        let dropoff = document.getElementById('dropoff').value;
        let km = document.getElementById('distanceKm').value;
        let driverPhone = document.getElementById('driverSelect').value;

        if (!dropoff) {
            alert('કૃપા કરીને ડ્રોપ લોકેશન લખો!');
            return;
        }
        if (!driverPhone) {
            alert('કૃપા કરીને ડ્રાઇવર પસંદ કરો!');
            return;
        }

        let message = "નમસ્કાર ડ્રાઇવર ભાઈ, મારે રિક્ષાની જરૂર છે.\n📍 ઉપાડવાનું સ્થળ: " + pickup + "\n🏁 જવાનું સ્થળ: " + dropoff + "\n📏 અંતર: " + km + " KM\nકૃપા કરીને રાઈડ સ્વીકારો.";
        let whatsappUrl = "https://wa.me/91" + driverPhone + "?text=" + encodeURIComponent(message);
        window.open(whatsappUrl, '_blank');
    }

    function cancelRide() {
        document.getElementById('dropoff').value = '';
        document.getElementById('distanceKm').value = '3';
        document.getElementById('driverSelect').selectedIndex = 0;
        alert('તમારું બુકિંગ રદ (Cancel) કરી દેવામાં આવ્યું છે.');
    }

    window.onload = loadDrivers;
</script>

</body>
</html>
