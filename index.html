<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ગઢડા ઓટો બુકિંગ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
            color: #34495e;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: #fff;
            box-sizing: border-box;
        }
        button.book-btn {
            width: 100%;
            background-color: #27ae60;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button.book-btn:hover {
            background-color: #219653;
        }
        .result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #e8f8f5;
            border: 1px solid #a3e4d7;
            border-radius: 8px;
        }
        .driver-card {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .driver-info h4 {
            margin: 0 0 5px 0;
            color: #2c3e50;
        }
        .driver-info p {
            margin: 0;
            font-size: 13px;
            color: #666;
        }
        .call-btn {
            background-color: #2980b9;
            color: white;
            padding: 8px 14px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .call-btn:hover {
            background-color: #1f618d;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ચાલો રિક્ષા</h2>
    <div class="subtitle">ગઢડા ઓટો બુકિંગ સર્વિસ</div>

    <label for="pickup">ક્યાંથી બેસવું છે? (Pickup Location)</label>
    <input type="text" id="pickup" placeholder="દા.ત. સ્વામિનારાયણ મંદિર, એસ.ટી. બસ સ્ટેન્ડ...">

    <label for="drop">ક્યાં જવું છે? (Drop Location)</label>
    <input type="text" id="drop" placeholder="દા.ત. બજાર ચોક, કોલેજ રોડ...">

    <button class="book-btn" onclick="calculateFareAndBook()">ભાડું ગણો અને રિક્ષા બોલાવો</button>

    <div id="result" class="result-box">
        <h3 style="margin-top:0; color:#16a085;">ડ્રાઇવર વિગત અને ભાડું</h3>
        <p id="fareText" style="font-size: 16px; font-weight: bold; color: #333;"></p>
        
        <div id="driverList"></div>
    </div>
</div>

<script>
    const drivers = [
        { name: "જમાલશાહ (Jamalshah)", phone: "9876543210", vehicle: "GJ-14-XX-1111" },
        { name: "અબ્બાસભાઈ (Abbasbhai)", phone: "9876543211", vehicle: "GJ-14-XX-2222" },
        { name: "સિકાભાઈ (Sikabhai)", phone: "9876543212", vehicle: "GJ-14-XX-3333" },
        { name: "સદામ (Sadam)", phone: "9876543213", vehicle: "GJ-14-XX-4444" },
        { name: "ઘુઘાભાઈ (Ghughabhai)", phone: "9876543214", vehicle: "GJ-14-XX-5555" },
        { name: "યુનુসભાઈ (Yunusbhai)", phone: "9876543215", vehicle: "GJ-14-XX-6666" }
    ];

    function calculateFareAndBook() {
        const pickup = document.getElementById('pickup').value.trim();
        const drop = document.getElementById('drop').value.trim();

        if (pickup === "" || drop === "") {
            alert("કૃપા કરીને પિકઅપ અને ડ્રોપ બંને લોકેશન લખો!");
            return;
        }

        if (pickup.toLowerCase() === drop.toLowerCase()) {
            alert("પિકઅપ અને ડ્રોપ લોકેશન અલગ-અલગ હોવા જોઈએ!");
            return;
        }

        // અંદાજિત અંતર (General calculation: 2.5 km average)
        let km = 2.5; 

        let baseFare = 30;
        let extraKm = km > 1 ? km - 1 : 0;
        let rawFare = baseFare + (extraKm * 10);

        // એડમિન કમિશન અંદર ગણાઈ જશે પણ મુસાફરને નહિ દેખાય
        let commission = rawFare * 0.05;
        let totalFare = Math.round(rawFare + commission);

        const randomDriver = drivers[Math.floor(Math.random() * drivers.length)];

        document.getElementById('fareText').innerHTML = 
            `સ્થળ: <b>${pickup}</b> થી <b>${drop}</b><br>` +
            `અંદાજિત અંતર: <b>${km} કિમી</b><br>` +
            `કુલ ભાડું: <b style="color:#d35400; font-size:18px;">₹${totalFare}</b><br>` +
            `<span style="font-size:13px; color:#555;">(પ્રથમ ૧ કિમીના ₹૩૦ + બાકીના કિમીના ₹૧૦)</span>`;

        let driverHtml = `
            <div class="driver-card">
                <div class="driver-info">
                    <h4>${randomDriver.name}</h4>
                    <p>રિક્ષા નંબર: ${randomDriver.vehicle}</p>
                </div>
                <a href="tel:${randomDriver.phone}" class="call-btn">📞 કોલ કરો</a>
            </div>
        `;

        document.getElementById('driverList').innerHTML = driverHtml;
        document.getElementById('result').style.display = 'block';
    }
</script>

</body>
</html>
