<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ગઢડા ઓટો બુકિંગ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #128C7E;
        }
        .fare-box {
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #0e6655;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ચાલો રિક્ષા</h2>
    <div class="subtitle">ગઢડા ઓટો બુકિંગ સેવા</div>

    <div class="form-group">
        <label for="passengerName">મુસાફરનું નામ:</label>
        <input type="text" id="passengerName" placeholder="તમારું નામ લખੋ">
    </div>

    <div class="form-group">
        <label for="pickup">ક્યાંથી બેસવું છે? (Pickup):</label>
        <input type="text" id="pickup" placeholder="ઉદા. સ્વામિનારાયણ મંદિર">
    </div>

    <div class="form-group">
        <label for="drop">ક્યાં જવું છે? (Drop):</label>
        <input type="text" id="drop" placeholder="ઉદા. બસ સ્ટેન્ડ">
    </div>

    <div class="form-group">
        <label for="distance">અંદાજિત અંતર (કિમી માં):</label>
        <input type="number" id="distance" placeholder="અંતર લખો (દા.ત. 3)" oninput="calculateFare()">
    </div>

    <div class="fare-box" id="fareDisplay">
        અંદાજિત ભાડું: ₹<span id="totalFare">0</span>
    </div>

    <button class="btn" onclick="bookOnWhatsApp()">💬 WhatsApp પર બુક કરો</button>
</div>

<script>
    function calculateFare() {
        let dist = parseFloat(document.getElementById('distance').value);
        let fareDisplay = document.getElementById('fareDisplay');
        let totalFareSpan = document.getElementById('totalFare');

        if (isNaN(dist) || dist <= 0) {
            fareDisplay.style.display = 'none';
            return;
        }

        let fare = 0;
        if (dist <= 1) {
            fare = 30; // પહેલા 1 કિમીના ₹30
        } else {
            fare = 30 + (dist - 1) * 10; // પછીના દરેક કિમીના ₹10
        }

        totalFareSpan.innerText = fare;
        fareDisplay.style.display = 'block';
    }

    function bookOnWhatsApp() {
        let name = document.getElementById('passengerName').value.trim();
        let pickup = document.getElementById('pickup').value.trim();
        let drop = document.getElementById('drop').value.trim();
        let distance = document.getElementById('distance').value.trim();
        let fare = document.getElementById('totalFare').innerText;

        if (!name || !pickup || !drop || !distance) {
            alert('કૃપા કરીને બધી માહિતી ભરો!');
            return;
        }

        // અહીં તમારો WhatsApp નંબર લખેલો છે (91 પાછળ દેશનો કોડ છે)
        let myWhatsAppNumber = "919426852334"; // <--- આ નંબર બદલીને તમારો WhatsApp નંબર નાખી દેજો!

        let message = `🛺 *નવી રિક્ષા બુકિંગ*\n\n` +
                      `👤 નામ: ${name}\n` +
                      `📍 પિકઅપ: ${pickup}\n` +
                      `🏁 ડ્રોપ: ${drop}\n` +
                      `📏 અંતર: ${distance} કિમી\n` +
                      `💰 ભાડું: ₹${fare}`;

        let url = `https://wa.me/${myWhatsAppNumber}?text=` + encodeURIComponent(message);
        window.open(url, '_blank');
    }
</script>

</body>
</html>
