<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ગઢડા</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; margin: 0; padding: 15px; }
        .container { max-width: 400px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; background-color: #fff; }
        .btn { background-color: #25D366; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .fare-box { background: #f1f8f5; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 16px; font-weight: bold; color: #0f3d2e; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h3>🛺 ચાલો રિક્ષા બુકિંગ</h3>

    <div class="form-group">
        <label>મુસાફરનું નામ:</label>
        <input type="text" id="pName" placeholder="તમારું નામ લખો">
    </div>

    <div class="form-group">
        <label>પિકઅપ સ્થળ:</label>
        <select id="pickup" onchange="calc()">
            <option value="">-- પસંદ કરો --</option>
            <option value="ગઢડા બસ સ્ટેન્ડ">ગઢડા બસ સ્ટેન્ડ</option>
            <option value="ગોપીનાથજી મંદિર">ગોપીનાથજી મંદિર</option>
            <option value="સ્વામિનારાયણ મંદિર">સ્વામિનારાયણ મંદિર</option>
            <option value="હોસ્પિટલ રોડ">હોસ્પિટલ રોડ</option>
            <option value="માર્કેટિંગ યાર્ડ">માર્કેટિંગ યાર્ડ</option>
        </select>
    </div>

    <div class="form-group">
        <label>જવાનું સ્થળ (ડ્રોપ):</label>
        <select id="drop" onchange="calc()">
            <option value="">-- પસંદ કરો --</option>
            <option value="ગઢડા બસ સ્ટેન્ડ">ગઢડા બસ સ્ટેન્ડ</option>
            <option value="ગોપીનાથજી મંદિર">ગોપીનાથજી મંદિર</option>
            <option value="સ્વામિનારાયણ મંદિર">સ્વામિનારાયણ મંદિર</option>
            <option value="હોસ્પિટલ રોડ">હોસ્પિટલ રોડ</option>
            <option value="માર્કેટિંગ યાર્ડ">માર્કેટિંગ યાર્ડ</option>
        </select>
    </div>

    <div class="form-group">
        <label>ડ્રાઈવર પસંદ કરો:</label>
        <select id="driver">
            <option value="9111111111">સિક્કા ભાઈ (GJ-14-1111)</option>
            <option value="9222222222">સદ્દામ ભાઈ (GJ-14-2222)</option>
            <option value="9333333333">યુનુસ ભાઈ (GJ-14-3333)</option>
            <option value="9444444444">ગફૂર મામા (GJ-14-4444)</option>
            <option value="9555555555">અન્ય ડ્રાઈવર ભાઈ (GJ-14-5555)</option>
            <option value="7779085469">રમીઝ ભાઈ (7779085469)</option>
            <option value="7383940831">ચાવડા અલ્ફાઝ (7383940831)</option>
            <option value="9327272466">ચાવડા ફ્રિદ (9327272466)</option>
            <option value="9157003186">નાનો કોલસાવાળા (9157003186)</option>
        </select>
    </div>

    <div class="fare-box">
        કુલ ભાડું: <span id="fareDisplay">₹55</span>
    </div>

    <button class="btn" onclick="book()">💬 વોટ્સએપ પર બુક કરો</button>
</div>

<script>
    let finalFare = 55;

    function calc() {
        let p = document.getElementById('pickup').value;
        let d = document.getElementById('drop').value;
        if (!p || !d || p === d) {
            finalFare = 55;
            document.getElementById('fareDisplay').innerText = '₹55';
            return;
        }
        let dist = 2.2;
        finalFare = 55 + Math.round(dist * 10);
        document.getElementById('fareDisplay').innerText = '₹' + finalFare;
    }

    function book() {
        let name = document.getElementById('pName').value.trim();
        let p = document.getElementById('pickup').value;
        let d = document.getElementById('drop').value;
        let dSelect = document.getElementById('driver');
        let dPhone = dSelect.value;
        let dName = dSelect.options[dSelect.selectedIndex].text;

        if (!name || !p || !d) {
            alert('કૃપા કરીને નામ અને બંને સ્થળ પસંદ કરો!');
            return;
        }

        let msg = `🛺 *નવી રિક્ષા બુકિંગ*\n\n👤 મુસાફર: ${name}\n📍 પિકઅપ: ${p}\n🏁 ડ્રોપ: ${d}\n💰 કુલ ભાડું: ₹${finalFare}\n👤 ડ્રાઈવર: ${dName}`;
        window.open(`https://wa.me/91${dPhone}?text=` + encodeURIComponent(msg), '_blank');
    }
</script>

</body>
</html>
