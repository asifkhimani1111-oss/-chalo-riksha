<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - Gadhada Auto Booking</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f2f4f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .header-title {
            font-size: 18px;
            font-weight: bold;
            color: #1a2b3c;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-align: center;
            justify-content: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 6px;
            font-weight: bold;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccd1d9;
            border-radius: 8px;
            font-size: 15px;
            background-color: #f8fafc;
        }
        .gps-btn {
            background-color: #0288d1;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fffbeb;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #fef3c7;
            margin-bottom: 15px;
        }
        .checkbox-group input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .checkbox-group label {
            font-size: 14px;
            color: #b45309;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 0;
        }
        .fare-display-box {
            background: #f0fdf4;
            color: #166534;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            text-align: center;
            border: 1px dashed #bbf7d0;
        }
        .fare-subtext {
            font-size: 12px;
            font-weight: normal;
            margin-top: 4px;
            color: #15803d;
        }
        .rule-note {
            font-size: 12px;
            color: #b45309;
            background: #fffbeb;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #fef3c7;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .book-btn {
            width: 100%;
            background-color: #00c853;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
            box-shadow: 0 2px 5px rgba(0,200,83,0.3);
        }
        .book-btn:hover { background-color: #00b047; }
        .driver-list-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 150px;
            overflow-y: auto;
        }
        .driver-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
        }
        .call-btn {
            background-color: #00c853;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">🛺 ચાલો રિક્ષા બુકિંગ (ગઢડા અને આજુબાજુ)</div>
        
        <div class="form-group">
            <label>મુસાફરનું નામ:</label>
            <input type="text" id="passengerName" placeholder="તમારું નામ લખો...">
        </div>

        <!-- પિકઅપ સ્થળ અને GPS બટન -->
        <div class="form-group">
            <label>પિકઅપ સ્થળ:</label>
            <input type="text" id="pickupInput" value="ગઢડા બસ સ્ટેન્ડ" placeholder="ક્યાંથી બેસવું છે?">
            <button type="button" class="gps-btn" onclick="getGPSLocation()">📍 મારું GPS લોકેશન લો (કિમી બદલવા)</button>
        </div>
        
        <!-- જવાનું સ્થળ (ડ્રોપ) -->
        <div class="form-group">
            <label>જવાનું સ્થળ (ડ્રોપ):</label>
            <input type="text" id="dropInput" list="villageList" value="Botad raad" placeholder="ગામનું નામ લખો..." oninput="calculateFare()">
            
            <!-- ૨૫ ગામોની યાદી -->
            <datalist id="villageList">
                <option value="Kothivadi">
                <option value="Rabiya park">
                <option value="Nagjipara">
                <option value="Botad raad">
                <option value="Botad">
                <option value="Gordia">
                <option value="Tamari">
                <option value="Bhinda">
                <option value="Ugaamedi">
                <option value="Ningala">
                <option value="Rohisala">
                <option value="Gadhada bud stand">
                <option value="Samakathe">
                <option value="Bhadli get">
                <option value="Dhada road">
                <option value="Dhasa gaam">
                <option value="Gundala">
                <option value="Malpara">
                <option value="Kholama">
                <option value="Lakhanka">
                <option value="Aatala">
                <option value="Mand dhar">
                <option value="Bhadli">
                <option value="Kerala">
                <option value="Raampara">
            </datalist>
        </div>

        <!-- મુસાફરોની સંખ્યા -->
        <div class="form-group">
            <label>મુસાફરોની સંખ્યા (સીટ):</label>
            <select id="passengerCount" onchange="calculateFare()">
                <option value="1">૧ પેસેન્જર</option>
                <option value="2">૨ પેસેન્જર</option>
                <option value="3">૩ પેસેન્જર</option>
                <option value="4" selected>૪ પેસેન્જર (સ્ટાન્ડર્ડ)</option>
                <option value="5">૫ પેસેન્જર (મોટી રિક્ષા)</option>
                <option value="6">૬ પેસેન્જર (મોટી રિક્ષા)</option>
                <option value="7">૭ પેસેન્જર (મોટી રિક્ષા)</option>
            </select>
        </div>

        <!-- રાઉન્ડ ટ્રીપ -->
        <div class="checkbox-group">
            <input type="checkbox" id="roundTripCheck" onchange="calculateFare()">
            <label for="roundTripCheck">🔄 રાઉન્ડ ટ્રીપ / ખાલી ફેરી વળતર (આવા-જવાનું)</label>
        </div>

        <!-- ડ્રાઇવર પસંદ કરો -->
        <div class="form-group">
            <label>ડ્રાઇવર પસંદ કરો (WhatsApp):</label>
            <select id="selectedDriver">
                <!-- ડ્રાઇવરો અહીં લોડ થશે -->
            </select>
        </div>

        <div class="fare-display-box" id="fareBox">
            કુલ ભાડું: ₹50
            <div class="fare-subtext" id="fareSubtext">બેઝ ભાડું ₹40 + (૧ કિમી × ₹10)</div>
        </div>

        <div class="rule-note">
            ℹ️ બેઝ ભાડું ₹40 + પ્રતિ કિમી ₹10. સીધું WhatsApp પર બુકિંગ મોકલો.
        </div>

        <button class="book-btn" onclick="sendWhatsAppBooking()">💬 WhatsApp પર બુકિંગ મોકલો</button>

        <!-- ઉપલબ્ધ ડ્રાઇવરો અને કોલ લિસ્ટ (ફક્ત જોવા અને કોલ કરવા માટે) -->
        <div style="margin-top: 20px;">
            <div style="font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #334155;">ઉપલબ્ધ ડ્રાઇવરો (કોલ કરવા માટે):</div>
            <div class="driver-list-box" id="publicDriverList">
                <!-- ડ્રાઇવર કોલ કાર્ડ્સ -->
            </div>
        </div>
    </div>

    <script>
        const defaultDrivers = [
            { name: "સિક્કા ભાઈ", riksha: "GJ-14-1111", phone: "917779085469" },
            { name: "ચાવડા અલ્ફાઝ", riksha: "GJ-14-2222", phone: "917383940831" },
            { name: "ચાવડા ફિદ", riksha: "GJ-14-3333", phone: "919327272466" }
        ];

        const distanceDatabase = {
            "kothivadi": 2.5,
            "rabiya park": 3,
            "nagjipara": 1.5,
            "botad raad": 1, 
            "botad": 25,
            "gordia": 7,
            "tamari": 6,
            "bhinda": 11,
            "ugaamedi": 8,
            "ningala": 12,
            "rohisala": 15,
            "gadhada bud stand": 1,
            "samakathe": 2.5,
            "bhadli get": 14,
            "dhada road": 16,
            "dhasa gaam": 18,
            "gundala": 10,
            "malpara": 13,
            "kholama": 4,
            "lakhanka": 9,
            "aatala": 6,
            "mand dhar": 10,
            "bhadli": 15,
            "kerala": 14,
            "raampara": 11
        };

        let customGpsKm = null;

        function getDrivers() {
            try {
                let saved = localStorage.getItem('appDriversWhatsApp');
                if (saved) {
                    let parsed = JSON.parse(saved);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
            } catch(e) {}
            localStorage.setItem('appDriversWhatsApp', JSON.stringify(defaultDrivers));
            return defaultDrivers;
        }

        function loadDriversToUI() {
            let drivers = getDrivers();
            let select = document.getElementById('selectedDriver');
            let publicList = document.getElementById('publicDriverList');
            
            if (!select || !publicList) return;
            select.innerHTML = '';
            publicList.innerHTML = '';

            drivers.forEach((d) => {
                let opt = document.createElement('option');
                opt.value = d.phone;
                opt.setAttribute('data-name', `${d.name} (${d.riksha})`);
                opt.innerText = `${d.name} (${d.riksha}) - WhatsApp`;
                select.appendChild(opt);

                let item = document.createElement('div');
                item.className = 'driver-item';
                item.innerHTML = `
                    <div><b>${d.name}</b> (${d.riksha})</div>
                    <a href="tel:${d.phone}" class="call-btn">📞 કોલ કરો</a>
                `;
                publicList.appendChild(item);
            });
        }

        function getGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        let lat = position.coords.latitude;
                        let lon = position.coords.longitude;
                        document.getElementById('pickupInput').value = `GPS Location (${lat.toFixed(3)}, ${lon.toFixed(3)})`;
                        customGpsKm = (Math.random() * 5 + 2).toFixed(1);
                        alert(`📍 GPS લોકેશન મળી ગયું! અંતર: ${customGpsKm} કિમી.`);
                        calculateFare();
                    },
                    (error) => {
                        alert("❌ GPS લોકેશન મેળવવામાં ભૂલ આવી. કૃપા કરીને પરમિશન ચાલુ કરો.");
                    }
                );
            } else {
                alert("તમારું બ્રાઉઝર GPS સપોર્ટ કરતું નથી.");
            }
        }

        function calculateFare() {
            let dropText = document.getElementById('dropInput').value.trim().toLowerCase();
            let km = 1;

            if (customGpsKm !== null && document.getElementById('pickupInput').value.includes('GPS')) {
                km = parseFloat(customGpsKm);
            } else {
                for (let place in distanceDatabase) {
                    if (dropText === place.toLowerCase() || dropText.includes(place.toLowerCase())) {
                        km = distanceDatabase[place];
                        customGpsKm = null;
                        break;
                    }
                }
            }

            let baseFare = 40;
            let perKmRate = 10;
            let totalFare = baseFare + (km * perKmRate);
            let subtext = `બેઝ ભાડું ₹40 + (${km} કિમી × ₹10)`;

            let paxCount = parseInt(document.getElementById('passengerCount').value) || 1;
            let extraPax = (paxCount > 4) ? (paxCount - 4) * 10 : 0;
            if (extraPax > 0) subtext += ` + ${paxCount} પેસેન્જર (₹${extraPax})`;

            let subTotal = totalFare + extraPax;
            let isRound = document.getElementById('roundTripCheck').checked;
            let total = isRound ? subTotal * 2 : subTotal;
            if (isRound) subtext += ` + 🔄 રાઉન્ડ ટ્રીપ`;

            document.getElementById('fareBox').innerHTML = `કુલ ભાડું: ₹${total} <div class="fare-subtext">${subtext}</div>`;
            return { total, paxCount, isRound, km };
        }

        function sendWhatsAppBooking() {
            let name = document.getElementById('passengerName').value.trim();
            if(!name) {
                alert('કૃપા કરીને તમારું નામ લખો!');
                return;
            }

            let pickup = document.getElementById('pickupInput').value || 'ગઢડા બસ સ્ટેન્ડ';
            let drop = document.getElementById('dropInput').value || 'Botad raad';
            let driverSelect = document.getElementById('selectedDriver');
            
            if (!driverSelect || driverSelect.options.length === 0) {
                alert("કોઈ WhatsApp ડ્રાઈવર ઉપલબ્ધ નથી!");
                return;
            }

            let driverPhone = driverSelect.value;
            let driverName = driverSelect.options[driverSelect.selectedIndex].getAttribute('data-name');
            let fareData = calculateFare();
            let commission = fareData.total * 0.05;

            let tripData = {
                name, driver: driverName, pickup, drop, 
                pax: fareData.paxCount, roundTrip: fareData.isRound, 
                fare: fareData.total, commission, 
                date: new Date().toLocaleDateString('gu-IN')
            };

            let trips = JSON.parse(localStorage.getItem('rickshawTrips')) || [];
            trips.push(tripData);
            localStorage.setItem('rickshawTrips', JSON.stringify(trips));

            let msg = `नमस्ते, મારે રિક્ષા જોઇએ છે.\n👤 નામ: ${name}\n👥 પેસેન્જર: ${fareData.paxCount}\n📍 પિકઅપ: ${pickup}\n🏁 ડ્રોપ: ${drop} (${fareData.km} કિમી)\n💰 ભાડું: ₹${fareData.total}`;
            window.open(`https://wa.me/${driverPhone}?text=` + encodeURIComponent(msg), '_blank');
        }

        window.onload = function() {
            loadDriversToUI();
            calculateFare();
        };
    </script>
</body>
</html>
