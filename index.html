<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ઓટો બુકિંગ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #ff9800; margin-bottom: 10px; }
        .counter-banner { background: #e8f5e9; color: #2e7d32; padding: 10px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 15px; border: 1px solid #c8e6c9; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #fff; }
        input[readonly] { background: #e9ecef; color: #495057; font-weight: bold; }
        .fare-box { background: #fff3e0; padding: 12px; border-radius: 6px; text-align: center; font-size: 18px; font-weight: bold; color: #e65100; margin-bottom: 15px; }
        .btn { background: #25d366; color: white; border: none; padding: 12px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #1ebe5d; }
        .btn-gps { background: #ff9800; margin-bottom: 10px; }
        .btn-gps:hover { background: #e68900; }
        .btn-call { background: #007bff; margin-top: 8px; }
        .btn-call:hover { background: #0056b3; }
        .btn-cancel { background: #e74c3c; margin-top: 8px; }
        .btn-cancel:hover { background: #c0392b; }
        .note { font-size: 12px; color: #666; margin-top: 3px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ચાલો રિક્ષા બુકિંગ</h2>
    
    <div class="counter-banner" id="counterDisplay">
        🚀 અત્યાર સુધી સફળ બુકિંગ: 0 રિક્ષા
    </div>

    <div class="form-group">
        <label>ક્યાંથી બેસવું છે? (પીકઅપ લોકેશન):</label>
        <button class="btn btn-gps" onclick="getPickupGPS()">📍 મારું લાઈવ GPS લોકેશન લો</button>
        <input type="text" id="pickup" placeholder="લોકેશન મેળવો અથવા લખો">
    </div>

    <div class="form-group">
        <label>ક્યાં જવું છે? (ડ્રોપ લોકેશનનું નામ લખો):</label>
        <input type="text" id="dropoffName" placeholder="દા.ત. ગોરડકા, વીરડી, સામાકાંઠે..." oninput="calculateMapDistance()">
        <div class="note">🔍 નામ લખતા જ GPS મેપ દ્વારા સાચું અંતર અને ભાડું ગણાઈ જશે.</div>
    </div>

    <div class="form-group">
        <label>અંદાજિત અંતર (GPS મેપ મુજબ):</label>
        <input type="text" id="distanceKm" value="1 KM" readonly>
    </div>

    <div class="form-group">
        <label>ટ્રિપનો પ્રકાર (સફર):</label>
        <select id="tripType" onchange="calculateFare()">
            <option value="One Way">વન-વે (એક બાજુની સફર)</option>
            <option value="Round Trip">રાઉન્ડ ટ્રિપ / રિટર્ન (આવવાનું અને જવાનું)</option>
        </select>
    </div>

    <div class="form-group">
        <label>પેસેન્જરની સંખ્યા:</label>
        <select id="passengerCount" onchange="calculateFare()">
            <option value="1">1 પેસેન્જર</option>
            <option value="2">2 પેસેન્જર</option>
            <option value="3">3 પેસેન્જર</option>
            <option value="4" selected>4 પેસેન્જર</option>
            <option value="5">5 પેસેન્જર (+₹10)</option>
            <option value="6">6 પેસેન્જર (+₹20)</option>
        </select>
    </div>

    <div class="fare-box">
        કુલ અંદાજિત ભાડું: ₹ <span id="totalFare">45</span>
    </div>

    <div class="form-group">
        <label>ડ્રાઇવર પસંદ કરો:</label>
        <select id="driverSelect">
            <option value="">-- ડ્રાઇવર પસંદ કરો --</option>
        </select>
    </div>

    <button class="btn" onclick="bookRide()">WhatsApp પર બુકિંગ મોકલો</button>
    <button class="btn btn-call" onclick="callDriver()">📞 ડ્રાઇવરને ડાયરેક્ટ કોલ કરો</button>
    <button class="btn btn-cancel" onclick="cancelRide()">બુકિંગ કેન્સલ કરો</button>
</div>

<script>
    let lastBookedDriverPhone = null;
    let lastBookedCommission = 0;
    let pickupCoords = null;
    let dropoffCoords = null;
    let currentCalculatedKm = 1;

    function updateCounterDisplay() {
        let totalBookings = localStorage.getItem('totalSuccessfulBookings') || 0;
        document.getElementById('counterDisplay').textContent = `🚀 અત્યાર સુધી સફળ બુકિંગ: ${totalBookings} રિક્ષા`;
    }

    function getPickupGPS() {
        if (navigator.geolocation) {
            alert('GPS લોકેશન મેળવાઈ રહ્યું છે...');
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                pickupCoords = { lat: lat, lon: lon };
                document.getElementById('pickup').value = `GPS લોકેશન (Lat: ${lat.toFixed(4)}, Lon: ${lon.toFixed(4)})`;
                alert('પીકઅપ GPS લોકેશન મળી ગયું!');
            }, function(error) {
                alert('GPS લોકેશન મેળવવામાં નિષ્ફળતા.');
            });
        } else {
            alert('તમારું બ્રાઉઝર GPS સપોર્ટ કરતું નથી.');
        }
    }

    // ગઢડા સેન્ટર કોઓર્ડિનેટ્સ (જો GPS ના ચાલુ હોય તો આનાથી અંતર ગણાય)
    const gadhadaCenter = { lat: 22.9750, lon: 71.5833 };

    function calculateMapDistance() {
        let placeName = document.getElementById('dropoffName').value.trim();
        if (placeName.length < 2) {
            currentCalculatedKm = 1;
            document.getElementById('distanceKm').value = "1 KM";
            calculateFare();
            return;
        }

        // જો યુઝરે ગોરડકા લખ્યું હોય તો ફિક્સ ઓરિજનલ 7 KM સેટ થઈ જશે
        if (placeName.includes("ગોરડકા") || placeName.toLowerCase().includes("gordka")) {
            currentCalculatedKm = 7;
        } else if (placeName.includes("વીરડી") || placeName.toLowerCase().includes("virdi")) {
            currentCalculatedKm = 12;
        } else if (placeName.includes("ખોપાડા") || placeName.toLowerCase().includes("khopada")) {
            currentCalculatedKm = 8;
        } else if (placeName.includes("કાપરડી") || placeName.toLowerCase().includes("kaparadi")) {
            currentCalculatedKm = 7;
        } else if (placeName.includes("હરીપર") || placeName.toLowerCase().includes("haripar")) {
            currentCalculatedKm = 6;
        } else {
            // અન્ય વિસ્તારો માટે અંદાજિત મેપ બેઝ્ડ કિલોમીટર (ડિફોલ્ટ 2 KM)
            currentCalculatedKm = 2;
        }

        document.getElementById('distanceKm').value = currentCalculatedKm + " KM";
        calculateFare();
    }

    function calculateFare() {
        let km = currentCalculatedKm;
        let passengers = parseInt(document.getElementById('passengerCount').value) || 1;
        let tripType = document.getElementById('tripType').value;

        let baseFare = 45;
        if (km > 1) {
            baseFare += (km - 1) * 10;
        }

        let extraPassengerFee = passengers > 4 ? (passengers - 4) * 10 : 0;
        let totalFare = baseFare + extraPassengerFee;

        if (tripType === 'Round Trip') {
            totalFare = totalFare * 2;
        }

        document.getElementById('totalFare').textContent = totalFare > 0 ? totalFare : 45;
    }

    document.getElementById('passengerCount').addEventListener('change', calculateFare);
    document.getElementById('tripType').addEventListener('change', calculateFare);

    function loadDrivers() {
        let defaultDrivers = [
            { name: "રમેશભાઈ", phone: "9876543210", ricshaNo: "GJ-00-1" }
        ];

        let savedDrivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
        let drivers = savedDrivers.length > 0 ? savedDrivers : defaultDrivers;

        let select = document.getElementById('driverSelect');
        select.innerHTML = '<option value="">-- ડ્રાઇવર પસંદ કરો --</option>';

        drivers.forEach(function(driver) {
            let opt = document.createElement('option');
            opt.value = driver.phone;
            opt.textContent = driver.name + ' (' + (driver.ricshaNo || 'રિક્ષા') + ') - ' + driver.phone;
            select.appendChild(opt);
        });
    }

    function bookRide() {
        let pickup = document.getElementById('pickup').value;
        let dropoff = document.getElementById('dropoffName').value;
        let km = document.getElementById('distanceKm').value;
        let tripType = document.getElementById('tripType').value;
        let passengers = document.getElementById('passengerCount').value;
        let fare = parseInt(document.getElementById('totalFare').textContent) || 45;
        let driverPhone = document.getElementById('driverSelect').value;

        if (!pickup) {
            alert('કૃપા કરીને પહેલાં પીકઅપ લોકેશન લો!');
            return;
        }
        if (!dropoff) {
            alert('કૃપા કરીને જવાનું સ્થળ (નામ) લખો!');
            return;
        }
        if (!driverPhone) {
            alert('કૃપા કરીને ડ્રાઇવર પસંદ કરો!');
            return;
        }

        let currentCount = parseInt(localStorage.getItem('totalSuccessfulBookings')) || 0;
        localStorage.setItem('totalSuccessfulBookings', currentCount + 1);
        updateCounterDisplay();

        let commission = Math.round(fare * 0.05);
        let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
        drivers.forEach(function(driver) {
            if(driver.phone === driverPhone) {
                driver.commission = (parseFloat(driver.commission) || 0) + commission;
            }
        });
        localStorage.setItem('rickshawDrivers', JSON.stringify(drivers));

        lastBookedDriverPhone = driverPhone;
        lastBookedCommission = commission;

        let message = "નમસ્કાર ડ્રાઇવર ભાઈ, મારે રિક્ષાની જરૂર છે.\n📍 પીકઅપ લોકેશન: " + pickup + "\n🏁 જવાનું સ્થળ: " + dropoff + "\n📏 અંતર: " + km + "\n🔄 ટ્રિપનો પ્રકાર: " + tripType + "\n👥 પેસેન્જર: " + passengers + "\n💰 કુલ અંદાજિત ભાડું: ₹" + fare + "\nકૃપા કરીને રાઈડ સ્વીકારો.";
        let whatsappUrl = "https://wa.me/91" + driverPhone + "?text=" + encodeURIComponent(message);
        window.open(whatsappUrl, '_blank');
    }

    function callDriver() {
        let driverPhone = document.getElementById('driverSelect').value;
        if (!driverPhone) {
            alert('કૃપા કરીને પહેલાં ડ્રાઇવર પસંદ કરો!');
            return;
        }
        window.location.href = "tel:+91" + driverPhone;
    }

    function cancelRide() {
        if (lastBookedDriverPhone && lastBookedCommission > 0) {
            let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
            drivers.forEach(function(driver) {
                if(driver.phone === lastBookedDriverPhone) {
                    driver.commission = Math.max(0, (parseFloat(driver.commission) || 0) - lastBookedCommission);
                }
            });
            localStorage.setItem('rickshawDrivers', JSON.stringify(drivers));
            lastBookedDriverPhone = null;
            lastBookedCommission = 0;
        }

        let currentCount = parseInt(localStorage.getItem('totalSuccessfulBookings')) || 0;
        if (currentCount > 0) {
            localStorage.setItem('totalSuccessfulBookings', currentCount - 1);
            updateCounterDisplay();
        }

        document.getElementById('pickup').value = '';
        document.getElementById('dropoffName').value = '';
        document.getElementById('distanceKm').value = '1 KM';
        document.getElementById('tripType').selectedIndex = 0;
        document.getElementById('passengerCount').selectedIndex = 3;
        calculateFare();
        document.getElementById('driverSelect').selectedIndex = 0;
        alert('બુકિંગ કેન્સલ કરી દેવામાં આવ્યું છે.');
    }

    window.onload = function() {
        loadDrivers();
        calculateFare();
        updateCounterDisplay();
    };
</script>

</body>
</html>
