<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ગઢડા ઓટો બુકિંગ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 15px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #34495e;
        }
        select, input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            background-color: #fff;
        }
        .btn {
            background-color: #25D366;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #128C7E;
        }
        .fare-box {
            background-color: #e8f8f5;
            border: 1px solid #a3e4d7;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #0e6655;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ચાલો રિક્ષા</h2>
    <div class="subtitle">ગઢડા ઓટો બુકિંગ સેવા</div>

    <div class="form-group">
        <label for="passengerName">મુસાફરનું નામ:</label>
        <input type="text" id="passengerName" placeholder="તમારું નામ લખો">
    </div>

    <div class="form-group">
        <label for="pickup">ક્યાંથી બેસવું છે? (પિકઅપ):</label>
        <select id="pickup" onchange="calculateFare()">
            <option value="">-- પિકઅપ લોકેશન પસંદ કરો --</option>
            <option value="સ્વામિનારાયણ મંદિર">સ્વામિનારાયણ મંદિર</option>
            <option value="બસ સ્ટેન્ડ">બસ સ્ટેન્ડ</option>
            <option value="હોસ્પિટલ રોડ">હોસ્પિટલ રોડ</option>
            <option value="માર્કેટિંગ યાર્ડ">માર્કેટિંગ યાર્ડ</option>
            <option value="ગઢડા બાયપાસ">ગઢડા બાયપાસ</option>
        </select>
    </div>

    <div class="form-group">
        <label for="drop">ક્યાં જવું છે? (ડ્રોપ):</label>
        <select id="drop" onchange="calculateFare()">
            <option value="">-- ડ્રોપ લોકેશન પસંદ કરો --</option>
            <option value="સ્વામિનારાયણ મંદિર">સ્વામિનારાયણ મંદિર</option>
            <option value="બસ સ્ટેન્ડ">બસ સ્ટેન્ડ</option>
            <option value="હોસ્પિટલ રોડ">હોસ્પિટલ રોડ</option>
            <option value="માર્કેટિંગ યાર્ડ">માર્કેટિંગ યાર્ડ</option>
            <option value="ગઢડા બાયપાસ">ગઢડા બાયપાસ</option>
        </select>
    </div>

    <div class="fare-box" id="fareDisplay">
        અંદાજિત અંતર: <span id="totalDist">0</span> કિમી<br>
        અંદાજિત ભાડું: ₹<span id="totalFare">0</span>
    </div>

    <button class="btn" onclick="bookOnWhatsApp()">💬 વોટ્સએપ પર બુક કરો</button>
</div>

<script>
    function calculateFare() {
        let pickup = document.getElementById('pickup').value;
        let drop = document.getElementById('drop').value;
        let fareDisplay = document.getElementById('fareDisplay');
        let totalFareSpan = document.getElementById('totalFare');
        let totalDistSpan = document.getElementById('totalDist');

        if (!pickup || !drop) {
            fareDisplay.style.display = 'none';
            return;
        }

        if (pickup === drop) {
            alert('પિકઅપ અને ડ્રોપ લોકેશન અલગ-અલગ હોવા જોઈએ!');
            fareDisplay.style.display = 'none';
            return;
        }

        let distance = 2; 
        if ((pickup === 'સ્વામિનારાયણ મંદિર' && drop === 'બસ સ્ટેન્ડ') || (pickup === 'બસ સ્ટેન્ડ' && drop === 'સ્વામિનારાયણ મંદિર')) {
            distance = 1.5;
        } else if ((pickup === 'હોસ્પિટલ રોડ' && drop === 'ગઢડા બાયપાસ') || (pickup === 'ગઢડા બાયપાસ' && drop === 'હોસ્પિટલ રોડ')) {
            distance = 3.5;
        } else {
            distance = 2.5;
        }

        let fare = 0;
        if (distance <= 1) {
            fare = 30;
        } else {
            fare = 30 + (Math.ceil(distance) - 1) * 10;
        }

        totalDistSpan.innerText = distance;
        totalFareSpan.innerText = fare;
        fareDisplay.style.display = 'block';
    }

    function bookOnWhatsApp() {
        let name = document.getElementById('passengerName').value.trim();
        let pickup = document.getElementById('pickup').value;
        let drop = document.getElementById('drop').value;
        let distance = document.getElementById('totalDist').innerText;
        let fare = document.getElementById('totalFare').innerText;

        if (!name || !pickup || !drop) {
            alert('કૃપા કરીને બધી માહિતી પસંદ કરો!');
            return;
        }

        let myWhatsAppNumber = "919426852334"; 

        let message = `🛺 *નવી રિક્ષા બુકિંગ*\n\n` +
                      `👤 નામ: ${name}\n` +
                      `📍 પિકઅપ: ${pickup}\n` +
                      `🏁 ડ્રોપ: ${drop}\n` +
                      `📏 અંતર: ${distance} કિમી\n` +
                      `💰 ભાડું: ₹${fare}`;

        let url = `https://wa.me/${myWhatsAppNumber}?text=` + encodeURIComponent(message);
        window.open(url, '_blank');
    }
</script>

</body>
</html>
