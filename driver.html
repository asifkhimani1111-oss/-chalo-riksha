<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ડ્રાઇવર અને એડમિન હિસાબ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #ff9800; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { width: 100%; background: #25d366; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn:hover { opacity: 0.9; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
        th { background: #ff9800; color: white; }
        .admin-box { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 ડ્રાઇવર રજિસ્ટ્રેશન</h2>
    
    <div class="form-group">
        <label>ડ્રાઇવરનું નામ:</label>
        <input type="text" id="driverName" placeholder="ડ્રાઇવરનું નામ લખો">
    </div>

    <div class="form-group">
        <label>મોબાઈલ / WhatsApp નંબર:</label>
        <input type="text" id="driverPhone" placeholder="નંબર લખો">
    </div>

    <button class="btn" onclick="registerDriver()">માહિતી સેવ કરો</button>

    <div class="admin-box">
        <h3>📊 એડમિન કમિશન હિસાબ (૫%)</h3>
        <p>દરેક ડ્રાઇવરની સફળ રાઈડ અને એડમિનના લેવાના થતા રૂપિયા:</p>
        <table>
            <thead>
                <tr>
                    <th>ડ્રાઇવરનું નામ</th>
                    <th>સક્સેસફુલ રાઈડ્સ</th>
                    <th>કુલ ભાડું (₹)</th>
                    <th>એડમિન કમિશન (૫%) (₹)</th>
                </tr>
            െ</thead>
            <tbody id="adminTableBody">
                <!-- અહીં ઓટોમેટિક ડેટા આવશે -->
            </tbody>
        </table>
    </div>
</div>

<script>
    function registerDriver() {
        let name = document.getElementById('driverName').value;
        let phone = document.getElementById('driverPhone').value;

        if(!name || !phone) {
            alert('કૃપા કરીને નામ અને નંબર બંને લખો!');
            return;
        }

        let drivers = JSON.parse(localStorage.getItem('chaloRikshaDrivers')) || [];
        drivers.push({ name, phone });
        localStorage.setItem('chaloRikshaDrivers', JSON.stringify(drivers));

        alert('ડ્રાઇવરની માહિતી સફળતાપૂર્વક સેવ થઈ ગઈ છે!');
        loadAdminData();
    }

    function loadAdminData() {
        let bookings = JSON.parse(localStorage.getItem('chaloRikshaBookings')) || [];
        let drivers = JSON.parse(localStorage.getItem('chaloRikshaDrivers')) || [{name: 'રમેશભાઈ', phone: '9876543210'}]; // Default demo driver

        let tableBody = document.getElementById('adminTableBody');
        tableBody.innerHTML = '';

        drivers.forEach(driver => {
            let successRides = bookings.length; // સરળતા માટે કુલ સક્સેસફુલ બુકિંગ ગણેલ છે
            let totalFare = bookings.reduce((sum, b) => sum + Number(b.fare || 0), 0);
            let adminCommission = totalFare * 0.05; // ૫% કમિશન

            let row = `<tr>
                <td>${driver.name}</td>
                <td>${successRides}</td>
                <td>₹${totalFare}</td>
                <td style="font-weight: bold; color: #d32f2f;">₹${adminCommission}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    }

    window.onload = loadAdminData;
</script>

</body>
</html>
