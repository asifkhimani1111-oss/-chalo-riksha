<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ચાલો રિક્ષા - ડ્રાઇવર ડેશબોર્ડ</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
        .container { max-width: 400px; margin: auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #2e7d32; margin-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; background: #fff; }
        .btn { background: #25d366; color: white; border: none; padding: 12px; width: 100%; font-size: 18px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn:hover { background: #1ebe5d; }
        .btn-toggle { background: #ff9800; }
        .btn-toggle:hover { background: #e68900; }
        .status-box { background: #e8f5e9; padding: 12px; border-radius: 6px; text-align: center; font-size: 16px; font-weight: bold; color: #2e7d32; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h2>🛺 રિક્ષા ડ્રાઇવર ડેશબોર્ડ</h2>

    <div class="status-box" id="driverStatusText">
        સ્થિતિ: લોકેશન બંધ છે ❌
    </div>

    <div class="form-group">
        <label>તમારું નામ:</label>
        <input type="text" id="driverName" placeholder="ડ્રાઇવરનું નામ લખੋ">
    </div>

    <div class="form-group">
        <label>મોબાઈલ નંબર (WhatsApp નંબર):</label>
        <input type="text" id="driverPhone" placeholder="10 અંકનો મોબાઈલ નંબર">
    </div>

    <button class="btn btn-toggle" onclick="toggleDriverStatus()">📍 મારું લોકેશન અને સ્ટેટસ ચાલુ કરો</button>
    <button class="btn" onclick="saveDriverProfile()">માહિતી સેવ કરો</button>
</div>

<script>
    function toggleDriverStatus() {
        let name = document.getElementById('driverName').value;
        let phone = document.getElementById('driverPhone').value;

        if (!name || !phone) {
            alert('કૃપા કરીને પહેલાં તમારું નામ અને મોબાઈલ નંબર લખો!');
            return;
        }

        let statusBox = document.getElementById('driverStatusText');
        statusBox.style.background = "#e8f5e9";
        statusBox.style.color = "#2e7d32";
        statusBox.textContent = "સ્થિતિ: લોકેશન ચાલુ છે (રાઈડ સ્વીકારવા તૈયાર) ✔";
        
        localStorage.setItem('activeDriverName', name);
        localStorage.setItem('activeDriverPhone', phone);
        alert('તમારું લોકેશન સફળતાપૂર્વક ચાલુ થઈ ગયું છે!');
    }

    function saveDriverProfile() {
        let name = document.getElementById('driverName').value;
        let phone = document.getElementById('driverPhone').value;

        if (!name || !phone) {
            alert('કૃપા કરીને નામ અને ફોન નંબર બંને ભરો!');
            return;
        }

        let drivers = JSON.parse(localStorage.getItem('rickshawDrivers')) || [];
        let existing = drivers.find(d => d.phone === phone);
        
        if (!existing) {
            drivers.push({ name: name, phone: phone });
            localStorage.setItem('rickshawDrivers', JSON.stringify(drivers));
            alert('ડ્રાઇવરની માહિતી સફળતાપૂર્વક સેવ થઈ ગઈ!');
        } else {
            alert('આ નંબર પહેલેથી જ રજીસ્ટર છે!');
        }
    }
</script>

</body>
</html>
